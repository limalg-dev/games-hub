name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Several suites drive the browser modules through node and skip without
      # it, which would silently drop the front-end coverage.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # -rs lists what skipped, so a suite that quietly stops running is
        # visible in the log instead of hiding inside the summary count.
        run: pytest -q -rs
