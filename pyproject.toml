[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkers-platform"
version = "0.1.0"
description = "Lightweight FastAPI checkers platform"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115", "uvicorn[standard]==0.30", "sqlmodel==0.0.21", "reportlab==5.0.1"]

[dependency-groups]
dev = ["pytest==8.2", "pytest-asyncio==1.4.0", "httpx==0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestDeprecationWarning",
    # fastapi/starlette internals emit this on Python 3.14+; fixed upstream in newer versions
    "ignore:.*asyncio\\.iscoroutinefunction.*is deprecated.*:DeprecationWarning",
]
