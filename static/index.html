<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameHub — Jogue Jogos Clássicos Online</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- ===== LANDING PAGE ===== -->
  <section id="landing" class="page active" aria-label="Game selection">
    <header class="hero">
      <h1>GameHub</h1>
      <p class="hero-tagline">Jogue jogos clássicos online — grátis, sem instalação.</p>
    </header>
    <nav class="category-nav" aria-label="Categorias de jogos">
      <ul class="category-list"></ul>
      <button class="category-toggle" aria-label="Abrir categorias" aria-expanded="false">Categorias</button>
    </nav>
    <main class="game-grid" id="game-grid" role="list"></main>
  </section>

  <!-- ===== GAME DETAIL MODAL ===== -->
  <div id="game-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" tabindex="-1"></div>
    <div class="modal-content">
      <button class="modal-close" aria-label="Fechar modal">&times;</button>
      <div class="modal-visual">
        <canvas id="modal-board-preview" width="320" height="320" aria-label="Checkers board preview"></canvas>
      </div>
      <div class="modal-info">
        <h2 id="modal-title"></h2>
        <p id="modal-desc"></p>
        <dl class="modal-specs" id="modal-specs"></dl>
        <div class="modal-rules" id="modal-rules"></div>
        <button class="btn-primary btn-play-large" id="modal-play-btn">Jogar Agora</button>
      </div>
    </div>
  </div>

  <!-- ===== GAME VIEW ===== -->
  <section id="game-view" class="page hidden" aria-label="Game in progress">
    <div id="play-gate" class="play-gate hidden">
      <div class="play-gate-inner">
        <h2 id="play-gate-title"></h2>
        <button class="btn-primary btn-play-large" id="play-gate-btn">Jogar</button>
      </div>
    </div>
    <header class="game-header">
      <button class="btn-back" id="btn-back-to-landing" aria-label="Voltar para a seleção de jogos">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <!-- Lives in the header, not inside #sidebar: the sidebar is translated
           off-screen on mobile, and its innerHTML is rewritten per game. -->
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir painel do jogo" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <div class="game-status">
        <span id="turn-indicator" aria-live="polite"></span>
        <span id="timer" class="hidden" aria-live="off">00:00</span>
      </div>
      <div class="game-menu">
        <button id="btn-new-game" class="btn-secondary">Novo Jogo</button>
        <button id="btn-resign" class="btn-danger">Desistir</button>
      </div>
    </header>
    <main class="game-main">
      <aside class="sidebar" id="sidebar" aria-label="Game info">
        <section class="panel elo-panel" id="elo-panel">
          <h4>🏅 Ranking</h4>
          <div class="elo-rating" id="elo-rating">—</div>
          <div class="elo-record" id="elo-record">V: 0 / D: 0 / E: 0</div>
          <div class="elo-peak" id="elo-peak"></div>
        </section>
        <section class="panel difficulty-select" id="ai-difficulty-panel">
          <h4>Dificuldade da IA</h4>
          <div class="diff-buttons">
            <button class="diff-btn active" data-diff="easy" onclick="window.setCheckersDifficulty('easy')">Fácil</button>
            <button class="diff-btn" data-diff="medium" onclick="window.setCheckersDifficulty('medium')">Médio</button>
            <button class="diff-btn" data-diff="hard" onclick="window.setCheckersDifficulty('hard')">Difícil</button>
          </div>
          <p class="diff-desc" id="ai-diff-desc">Profundidade: 2</p>
        </section>
        <section class="panel captured" id="captured-white">
          <h4>Capturadas (Brancas)</h4>
          <div class="pieces" id="captured-white-pieces"></div>
        </section>
        <section class="panel history" id="move-history">
          <h4>Histórico de Jogadas</h4>
          <ol id="history-list"></ol>
        </section>
        <section class="panel captured" id="captured-black">
          <h4>Capturadas (Pretas)</h4>
          <div class="pieces" id="captured-black-pieces"></div>
        </section>
      </aside>
      <div class="board-wrapper" id="board-wrapper">
        <canvas id="board-canvas" width="640" height="640" aria-label="Checkers game board"></canvas>
        <div class="board-overlay" id="board-overlay" aria-hidden="true"></div>
      </div>
    </main>
  </section>

  <!-- ===== GAME OVER OVERLAY ===== -->
  <div class="game-over-overlay hidden" id="game-over-overlay">
    <div class="game-over-content">
      <div class="game-over-title" id="game-over-title"></div>
      <div class="game-over-message" id="game-over-message"></div>
      <div class="elo-summary" id="elo-summary">
        <div class="elo-change" id="elo-change"></div>
        <div class="elo-new-rating" id="elo-new-rating"></div>
        <div class="elo-stats-line" id="elo-stats-line"></div>
      </div>
      <div class="game-over-actions">
        <button class="btn-primary" id="btn-game-over-again">Jogar Novamente</button>
        <button class="btn-secondary" id="btn-game-over-back">Voltar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/app.js?v=2"></script>
</body>
</html>
