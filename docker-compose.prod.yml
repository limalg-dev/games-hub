version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - gamehub-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////data/games.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gamehub-data:
    driver: local
